# Blue Water Pool — Netlify configuration
# Static site: no build step, publish from the repo root.

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Security headers
# NOTE: When GA4 is enabled (uncomment the snippet in each page <head>),
# extend the CSP:
#   script-src 'self' https://www.googletagmanager.com;
#   connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com;
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# Long-cache immutable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------------------
# Redirects: enforce clean URLs
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
