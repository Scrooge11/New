<style>

:root{--bg:#F4F6F3;--card:#FFFFFF;--line:#DFE6DF;--line2:#C8D4C9;--ink:#17251F;--tx:#2C3A32;--dim:#6C7B70;

body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased;

/* v4 additions */
.conf{display:inline-block;background:var(--grn-soft);border:1px solid #C6DACF;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--grn);font-weight:600}
.segbtns{display:flex;gap:6px;margin-top:4px}
.segbtn{border:1px solid var(--line2);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:700;background:#fff;color:var(--dim)}

.statusrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}

.stpill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 10px}
.stpill.proposed{background:#EEF1EE;color:var(--dim)}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:#C9D4CB}

.flag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--gold-soft);color:var(--gold);border:1px solid #E4D4A9;border-radius:6px;padding:2px 7px;margin:2px 3px 2px 0}
.flaglist{margin-top:8px}
.mcstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.progress{height:10px;background:#EDF1EC;border-radius:99px;overflow:hidden}

.tabcount{display:inline-block;background:var(--warn);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
table.heat td{text-align:center}
@media (max-width:1020px){.mcstats{grid-template-columns:1fr 1fr}}
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* RATE COMMITTEE 2027 — Meridian & Cole LLP
   AmLaw-100 rate analysis console · light professional theme
   Globals: React, ReactDOM, Chart, Papa */

const { useState, useMemo, useRef, useEffect } = React;

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const rand = mulberry32(20270215);
const R = (lo, hi) => lo + rand() * (hi - lo);
const pick = (a) => a[Math.floor(rand() * a.length)];
const round5 = (x) => Math.round(x / 5) * 5;
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const fmt$ = (n) => "$" + Math.round(n).toLocaleString("en-US");
const fmtPct = (n, d = 1) => (isFinite(n) ? n.toFixed(d) : "–") + "%";
const fmtM = (n) => "$" + (n / 1e6).toFixed(2) + "M";
const pctile = (arr, q) => { const s = [...arr].sort((a, b) => a - b); if (!s.length) return 0;
  const p = (s.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return s[lo] + (s[hi] - s[lo]) * (p - lo); };

const YEARS = [2022, 2023, 2024, 2025, 2026];
const PRACTICES_LIT = ["Commercial Litigation", "Product Liability", "White Collar", "IP Litigation"];
const PRACTICES_NONLIT = ["M&A / PE", "Capital Markets", "Restructuring", "Real Estate", "Tax", "Labor & Emp"];
const ASSOC_LADDER_2026 = [0, 595, 650, 710, 775, 845, 915, 975, 1025];

const COHORTS = ["A1","A2","A3","A4","A5","A6","A7","A8","Counsel","Paralegal","PtrNonLit","PtrLit"];
const COHORT_LBL = { A1:"A1",A2:"A2",A3:"A3",A4:"A4",A5:"A5",A6:"A6",A7:"A7",A8:"A8",
  Counsel:"Counsel", Paralegal:"Paralegal", PtrNonLit:"Ptr Non-Lit", PtrLit:"Ptr Lit" };
const cohortOf = (t) => t.title === "Associate" ? "A" + t.cls :
  t.title === "Partner" ? (t.segment === "Litigation" ? "PtrLit" : "PtrNonLit") : t.title;

/* ---------- peer panel (MOCK — replace with BRASS / Valeo extracts) ---------- */
const PEER_BASE = { A1:615,A2:670,A3:730,A4:800,A5:870,A6:940,A7:1000,A8:1055,
  Counsel:995, Paralegal:390, PtrNonLit:1385, PtrLit:1290 };
const PEER_FIRM_DEFS = [
  ["Ashworth & Calder", 1.22, "Valeo"], ["Blackwell Reed", 1.14, "BRASS"],
  ["Crandall & Moss", 1.08, "Valeo"], ["Davenport Hale", 1.04, "BRASS"],
  ["Ellison Marsh", 1.00, "Valeo"], ["Fairbank Whitlow", 0.97, "BRASS"],
  ["Grantham Pierce", 0.94, "Valeo"], ["Holloway & Trent", 0.91, "BRASS"],
  ["Ingram Roth", 0.88, "Valeo"], ["Kestrel Vance", 1.18, "BRASS"],
];
const PEER_FIRMS = PEER_FIRM_DEFS.map(([name, mult, src], i) => {
  const rates = {}; COHORTS.forEach((c) => { rates[c] = round5(PEER_BASE[c] * mult * R(0.985, 1.015)); });
  return { id: "pf" + i, name, src, mult, rates,
    incHist: [R(4.4,5.8), R(5.2,6.8), R(6.6,8.2), R(6.0,7.6)].map((x) => +x.toFixed(1)) };
});

/* ---------- mock timekeepers ---------- */
const FIRST = ["J.","M.","A.","R.","S.","D.","K.","L.","T.","C.","E.","P.","N.","G.","B.","V.","H.","W."];
const LAST = ["Alvarez","Brennan","Castellano","Donovan","Egerton","Farrell","Grieco","Halloran","Iverson","Jankowski","Kessler","Lombardi","Marchetti","Novak","O'Rourke","Pellegrini","Quintana","Rossi","Sutherland","Takahashi","Ulrich","Vance","Whitfield","Yates","Zamora","Ashford","Bellamy","Colombo","DeSantis","Esposito","Ferraro","Gallo","Huang","Ianelli","Jefferies","Katz","Lindqvist","Moreau","Nakamura","Okafor","Petrov","Reyes","Salerno","Tran","Underwood","Villanueva","Winslow","Xu","Yusuf","Ziegler","Abbott","Beaumont","Carver","Delgado","Emerson","Foster"];

function genHistory(rate2026, incAvg) {
  const rates = {}; let r = rate2026;
  for (let i = YEARS.length - 1; i >= 0; i--) { rates[YEARS[i]] = round5(r); r = r / (1 + incAvg + R(-0.015, 0.015)); }
  return rates;
}
function finishTk(t) {
  t.realHist = {}; t.hoursHist = {};
  YEARS.forEach((yr, i) => { const d = YEARS.length - 1 - i;
    t.realHist[yr] = clamp(t.real + d * R(-0.012, 0.004), 0.76, 0.985);
    t.hoursHist[yr] = Math.round(clamp(t.hours + d * R(-90, 40), 1050, 2400)); });
  return t;
}
function makeMockTimekeepers() {
  const tks = []; let id = 1; const used = new Set();
  const nm = () => { let n; do { n = pick(FIRST) + " " + pick(LAST); } while (used.has(n)); used.add(n); return n; };
  for (let i = 0; i < 14; i++) tks.push(finishTk({ id: id++, name: nm(), title: "Partner", segment: "Litigation",
    cls: null, practice: PRACTICES_LIT[i % 4], rate2026: round5(R(1050, 1520)), hours: Math.round(R(1350, 2150)), real: R(0.82, 0.965) }));
  for (let i = 0; i < 12; i++) tks.push(finishTk({ id: id++, name: nm(), title: "Partner", segment: "Non-Litigation",
    cls: null, practice: PRACTICES_NONLIT[i % 6], rate2026: round5(R(1120, 1640)), hours: Math.round(R(1300, 2100)), real: R(0.83, 0.97) }));
  for (let i = 0; i < 8; i++) tks.push(finishTk({ id: id++, name: nm(), title: "Counsel",
    segment: i % 2 ? "Litigation" : "Non-Litigation", cls: null,
    practice: i % 2 ? PRACTICES_LIT[i % 4] : PRACTICES_NONLIT[i % 6],
    rate2026: round5(R(860, 1060)), hours: Math.round(R(1400, 2050)), real: R(0.83, 0.95) }));
  for (let c = 1; c <= 8; c++) for (let i = 0; i < 4; i++) tks.push(finishTk({ id: id++, name: nm(), title: "Associate",
    segment: i % 2 ? "Litigation" : "Non-Litigation", cls: c,
    practice: i % 2 ? PRACTICES_LIT[(c + i) % 4] : PRACTICES_NONLIT[(c + i) % 6],
    rate2026: ASSOC_LADDER_2026[c], hours: Math.round(R(1500, 2250)), real: R(0.80, 0.94) }));
  for (let i = 0; i < 8; i++) tks.push(finishTk({ id: id++, name: nm(), title: "Paralegal",
    segment: i % 2 ? "Litigation" : "Non-Litigation", cls: null,
    practice: i % 2 ? PRACTICES_LIT[i % 4] : PRACTICES_NONLIT[i % 6],
    rate2026: round5(R(295, 425)), hours: Math.round(R(1300, 1950)), real: R(0.86, 0.97) }));
  tks.forEach((t) => { t.rates = genHistory(t.rate2026, t.title === "Associate" ? 0.08 : R(0.045, 0.075)); });
  return tks;
}
const MOCK_TKS = makeMockTimekeepers();

/* ---------- engine (pure — reusable for scenarios & sensitivity) ---------- */
function buildPeerStats(selectedIds, peerInfl) {
  const sel = PEER_FIRMS.filter((f) => selectedIds.has(f.id));
  const stats = {};
  COHORTS.forEach((c) => { const xs = sel.map((f) => f.rates[c]);
    stats[c] = { p25: pctile(xs, .25), p50: pctile(xs, .5), p75: pctile(xs, .75), p90: pctile(xs, .9),
      p50_27: pctile(xs, .5) * (1 + peerInfl / 100), n: xs.length }; });
  const incAvg = [0,1,2,3].map((i) => sel.length ? sel.reduce((a, f) => a + f.incHist[i], 0) / sel.length : 0);
  return { stats, incAvg, firms: sel };
}

function baseIncFor(t, cfg, peer) {
  const coh = cohortOf(t);
  const ps = peer.stats[coh]; const med27 = ps.p50_27 || 1;
  const hoursNorm = clamp((t.hours - 1300) / 850, 0, 1);
  const realNorm = clamp((t.real - 0.80) / 0.16, 0, 1);
  const headroom = clamp((med27 - t.rate2026) / (0.22 * med27), 0, 1);
  const wSum = cfg.wHours + cfg.wReal + cfg.wPeer || 1;
  const score = Math.round(100 * (cfg.wHours * hoursNorm + cfg.wReal * realNorm + cfg.wPeer * headroom) / wSum);
  let inc, mode = "scored";
  if (t.title === "Associate") { mode = "scale"; inc = cfg.assocScale; }
  else {
    const cap = t.title === "Paralegal" ? cfg.capPct * 0.6 : cfg.capPct;
    if (score < cfg.holdBelow) { inc = cfg.floorPct * 0.5; mode = "hold"; }
    else inc = cfg.floorPct + (cap - cfg.floorPct) * Math.pow(score / 100, 0.9);
    const k = t.title === "Partner" ? (t.segment === "Litigation" ? "PtrLit" : "PtrNonLit") : t.title;
    inc = clamp(inc + (cfg.adj[k] || 0), 0, cfg.capPct + 4);
  }
  return { coh, score, inc, mode, med27, ps };
}


/* ---------- engine v4: effective economics, velocity, rounding, flags ---------- */
const roundStep = (x, step) => Math.round(x / step) * step;

function computeModel(tks, cfg, overrides, selectedPeers) {
  const peer = buildPeerStats(selectedPeers, cfg.peerInfl);
  const bases = tks.map((t) => ({ t, b: baseIncFor(t, cfg, peer) }));
  const H = tks.reduce((a, t) => a + t.hours, 0) || 1;
  const cs = cfg.capShare / 100, vel = cfg.velocity / 100;

  const rowsFor = (mult) => bases.map(({ t, b }) => {
    const ov = overrides[t.id];
    let inc, mode = b.mode;
    if (ov != null && t.title !== "Associate") { inc = ov; mode = "override"; }
    else inc = clamp(b.inc * mult, 0, (t.title === "Associate" ? cfg.assocScale * 2.2 : cfg.capPct + 4));
    const rate2027 = roundStep(t.rate2026 * (1 + inc / 100), cfg.roundTo);
    const incStd = (rate2027 / t.rate2026 - 1) * 100;
    const incEff = incStd * (1 - cs) + Math.min(incStd, cfg.capLevel) * cs;
    const effRate27 = t.rate2026 * (1 + incEff / 100);
    return { ...t, cohort: b.coh, score: b.score, mode, rate2027, effRate27,
      incPct: incStd, incEff, peerP50: b.ps.p50, peerMed27: round5(b.med27), p90_27: b.ps.p90 * (1 + cfg.peerInfl / 100),
      vsPeer27: (rate2027 / b.med27 - 1) * 100 };
  });
  const blendedOf = (rows) => {
    const b26 = rows.reduce((a, r) => a + r.rate2026 * r.hours, 0) / H;
    const b27 = rows.reduce((a, r) => a + r.rate2027 * r.hours, 0) / H;
    return { b26, b27, inc: (b27 / b26 - 1) * 100 };
  };

  let goalMult = 1, goalNote = null;
  if (cfg.goalTarget > 0) {
    let lo = 0, hi = 3;
    for (let i = 0; i < 42; i++) { const mid = (lo + hi) / 2;
      if (blendedOf(rowsFor(mid)).inc < cfg.goalTarget) lo = mid; else hi = mid; }
    goalMult = (lo + hi) / 2;
    const achieved = blendedOf(rowsFor(goalMult)).inc;
    if (Math.abs(achieved - cfg.goalTarget) > 0.15) goalNote = "target constrained by caps/overrides — achieved " + fmtPct(achieved);
  }
  const rows = rowsFor(goalMult);
  const { b26: blended26, b27: blended27, inc: blendedInc } = blendedOf(rows);
  const effBlended27 = rows.reduce((a, r) => a + r.effRate27 * r.hours, 0) / H;
  const effBlendedInc = (effBlended27 / blended26 - 1) * 100;

  const grossStd = rows.reduce((a, r) => a + r.hours * (r.rate2027 - r.rate2026) * r.real, 0);
  const grossEff = rows.reduce((a, r) => a + r.hours * (r.effRate27 - r.rate2026) * r.real, 0);
  const capLeak = grossStd - grossEff;
  const carryover = grossEff * (1 - vel);
  const year1Gross = grossEff * vel;
  const R27H = rows.reduce((a, r) => a + r.hours * r.effRate27, 0);
  const erosion = Math.max(0, effBlendedInc - cfg.peerInfl) * (cfg.dragBps / 10000);
  const drag = R27H * erosion * vel;
  const net = year1Gross - drag;

  const holds = rows.filter((r) => r.mode === "hold");
  const ovr = rows.filter((r) => r.mode === "override");
  const abovePeer = rows.filter((r) => r.vsPeer27 > 0).length;

  /* QC flags */
  rows.forEach((r) => {
    const f = [];
    if (r.rate2027 > r.p90_27) f.push("Above panel P90");
    if (r.incPct >= 6 && r.real < 0.85) f.push("High increase / soft realization");
    if (r.vsPeer27 < -12) f.push("Under-market — headroom unused");
    if (r.mode === "override") f.push("Manual override");
    if (r.mode === "hold") f.push("Held below score threshold");
    r.flags = f;
  });
  const flagged = rows.filter((r) => r.flags.length);

  const segDefs = [["PtrLit","Partners — Litigation"],["PtrNonLit","Partners — Non-Lit"],["Counsel","Counsel"],["Associate","Associates (scale)"],["Paralegal","Paralegals"]];
  const bySegment = segDefs.map(([k, label]) => {
    const g = rows.filter((r) => k === "Associate" ? r.title === "Associate" : k === "Counsel" ? r.title === "Counsel"
      : k === "Paralegal" ? r.title === "Paralegal" : r.cohort === k);
    const gh = g.reduce((a, r) => a + r.hours, 0) || 1;
    return { key: k, label, n: g.length,
      avg26: g.reduce((a, r) => a + r.rate2026, 0) / (g.length || 1),
      avg27: g.reduce((a, r) => a + r.rate2027, 0) / (g.length || 1),
      inc: g.reduce((a, r) => a + r.incPct * r.hours, 0) / gh,
      incEff: g.reduce((a, r) => a + r.incEff * r.hours, 0) / gh,
      uplift: g.reduce((a, r) => a + r.hours * (r.effRate27 - r.rate2026) * r.real, 0),
      real: g.reduce((a, r) => a + r.real * r.hours, 0) / gh,
      hrs: gh / (g.length || 1) };
  });

  const trend = YEARS.map((yr) => ({ yr,
    avgRate: Math.round(tks.reduce((a, t) => a + (t.rates[yr] || t.rate2026), 0) / (tks.length || 1)),
    real: +(tks.reduce((a, t) => a + (t.realHist[yr] || t.real), 0) / (tks.length || 1) * 100).toFixed(1),
    hours: Math.round(tks.reduce((a, t) => a + (t.hoursHist[yr] || t.hours), 0) / (tks.length || 1)) }));
  const trendInc = YEARS.slice(1).map((yr, i) => ({ yr,
    firm: +((trend[i + 1].avgRate / trend[i].avgRate - 1) * 100).toFixed(1), peer: +peer.incAvg[i].toFixed(1) }));
  trendInc.push({ yr: 2027, firm: +blendedInc.toFixed(1), peer: cfg.peerInfl });

  const firmCohort26 = {}, firmCohort27 = {};
  COHORTS.forEach((c) => { const g = rows.filter((r) => r.cohort === c);
    firmCohort26[c] = g.length ? g.reduce((a, r) => a + r.rate2026, 0) / g.length : null;
    firmCohort27[c] = g.length ? g.reduce((a, r) => a + r.rate2027, 0) / g.length : null; });

  const ladder = [];
  for (let c = 1; c <= 8; c++) { const ps = peer.stats["A" + c];
    ladder.push({ cls: "C" + c, p25: ps.p25, p50: ps.p50, p75: ps.p75, p50_27: round5(ps.p50_27),
      firm26: firmCohort26["A" + c], firm27: firmCohort27["A" + c] }); }

  const baseRev = rows.reduce((a, r) => a + r.hours * r.rate2026 * r.real, 0);
  return { rows, peer, blended26, blended27, blendedInc, effBlendedInc, grossStd, grossEff, capLeak,
    carryover, year1Gross, drag, net, erosion, R27H, holds, ovr, abovePeer, flagged, bySegment, trend, trendInc,
    firmCohort26, firmCohort27, ladder, headcount: rows.length, baseRev, goalMult, goalNote };
}

/* ---------- Monte Carlo (seeded, reproducible) ---------- */
function runMonteCarlo(M, cfg, N = 2500) {
  const rng = mulberry32(424242);
  const norm = () => { let u = 0, v = 0; while (!u) u = rng(); while (!v) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const nets = new Array(N);
  const avgReal = 0.88;
  for (let i = 0; i < N; i++) {
    const peerI = cfg.peerInfl + norm() * 1.0;
    const dragI = Math.max(0, cfg.dragBps + norm() * (cfg.dragBps * 0.4 + 3));
    const velI = clamp(cfg.velocity + norm() * 6, 30, 100) / 100;
    const hoursF = 1 + norm() * 0.03;
    const realShift = norm() * 0.006;
    const erosionI = Math.max(0, M.effBlendedInc - peerI) * (dragI / 10000);
    const g = M.grossEff * hoursF * (1 + realShift / avgReal);
    nets[i] = g * velI - M.R27H * hoursF * erosionI * velI;
  }
  nets.sort((a, b) => a - b);
  const q = (p) => nets[Math.floor(p * (N - 1))];
  const mean = nets.reduce((a, b) => a + b, 0) / N;
  const bins = 22, lo = nets[0], hi = nets[N - 1], w = (hi - lo) / bins || 1;
  const hist = new Array(bins).fill(0);
  nets.forEach((v) => hist[Math.min(bins - 1, Math.floor((v - lo) / w))]++);
  return { p10: q(.10), p50: q(.50), p90: q(.90), mean, probPos: nets.filter((v) => v > 0).length / N,
    hist, lo, w, N };
}

Chart.defaults.color = "#5B6B60";
Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.borderColor = "#E3E9E2";

function ChartBox({ type, data, options, height = 260 }) {
  const ref = useRef(null), inst = useRef(null);
  useEffect(() => {
    if (inst.current) inst.current.destroy();
    inst.current = new Chart(ref.current, { type, data, options: { responsive: true, maintainAspectRatio: false, ...options } });
    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  }, [data, options, type]);
  return <div style={{ height }}><canvas ref={ref} /></div>;
}
const legend = (pos = "bottom") => ({ legend: { position: pos, labels: { boxWidth: 10, boxHeight: 10, padding: 10, usePointStyle: true } } });
const money = { ticks: { callback: (v) => "$" + v.toLocaleString() } };
const pct = { ticks: { callback: (v) => v + "%" } };

/* ---------- UI primitives ---------- */
function Card({ title, sub, right, children, style, className }) {
  return (
    <section className={"card " + (className || "")} style={style}>
      {(title || right) && <header className="chead"><div><h3>{title}</h3>{sub && <p className="csub">{sub}</p>}</div>{right}</header>}
      <div className="cbody">{children}</div>
    </section>
  );
}
function Delta({ v, suffix = "%", flip = false }) {
  const pos = flip ? v < 0 : v >= 0;
  return <span className={"delta " + (pos ? "pos" : "neg")}>{pos ? "▲" : "▼"} {Math.abs(v).toFixed(1)}{suffix}</span>;
}
function Stat({ label, value, delta, note, spark }) {
  return (
    <div className="stat">
      <div className="slabel">{label}</div>
      <div className="srow"><span className="sval">{value}</span>{delta}</div>
      {spark && <div className="sspark">{spark}</div>}
      {note && <div className="snote">{note}</div>}
    </div>
  );
}
function Spark({ pts, color = "#14563F", fmt }) {
  const data = useMemo(() => ({ labels: pts.map((p) => p.yr),
    datasets: [{ data: pts.map((p) => p.v), borderColor: color, borderWidth: 1.6, pointRadius: 0, tension: .35,
      fill: true, backgroundColor: (ctx) => { const g = ctx.chart.ctx.createLinearGradient(0,0,0,44);
        g.addColorStop(0, color + "33"); g.addColorStop(1, color + "00"); return g; } }] }), [pts, color]);
  const options = useMemo(() => ({ plugins: { legend: { display: false },
    tooltip: { callbacks: { label: (c) => fmt ? fmt(c.parsed.y) : c.parsed.y } } },
    scales: { x: { display: false }, y: { display: false } } }), [fmt]);
  return <ChartBox type="line" data={data} options={options} height={44} />;
}

/* ---------- heatmap ---------- */
function heatColor(v, lo, hi, invert) {
  let t = clamp((v - lo) / (hi - lo || 1), 0, 1);
  if (invert) t = 1 - t;
  // red -> pale -> green
  const r = t < .5 ? 214 : Math.round(214 - (t - .5) * 2 * 174);
  const g = t < .5 ? Math.round(120 + t * 2 * 100) : 220;
  const b = t < .5 ? 110 : Math.round(110 + (t - .5) * 2 * 40);
  return `rgba(${t < .5 ? 214 : 40 + (1 - t) * 120},${t < .5 ? 100 + t * 190 : 150},${90},${0.16 + 0.22 * Math.abs(t - .5) * 2})`;
}
function HeatTable({ M }) {
  const rows = COHORTS.map((c) => {
    const g = M.rows.filter((r) => r.cohort === c);
    if (!g.length) return null;
    const gh = g.reduce((a, r) => a + r.hours, 0);
    const s = M.peer.stats[c];
    return { c, vs26: (M.firmCohort26[c] / s.p50 - 1) * 100,
      vs27: (M.firmCohort27[c] / (s.p50_27 || 1) - 1) * 100,
      real: g.reduce((a, r) => a + r.real * r.hours, 0) / gh * 100,
      hrs: gh / g.length,
      inc: g.reduce((a, r) => a + r.incPct * r.hours, 0) / gh };
  }).filter(Boolean);
  const cell = (v, lo, hi, fmt, invert) => (
    <td style={{ background: heatColor(v, lo, hi, invert), fontWeight: 600 }}>{fmt(v)}</td>);
  return (
    <div className="twrap" style={{ maxHeight: "none" }}><table className="mini heat">
      <thead><tr><th>Cohort</th><th>'26 vs panel med</th><th>'27 reco vs med '27E</th><th>Realization</th><th>Avg T12M hrs</th><th>Wtd increase</th></tr></thead>
      <tbody>{rows.map((r) => (
        <tr key={r.c} style={{ cursor: "default" }}>
          <td className="tname">{COHORT_LBL[r.c]}</td>
          {cell(r.vs26, -15, 15, (v) => (v >= 0 ? "+" : "") + fmtPct(v))}
          {cell(r.vs27, -15, 15, (v) => (v >= 0 ? "+" : "") + fmtPct(v))}
          {cell(r.real, 82, 96, (v) => fmtPct(v))}
          {cell(r.hrs, 1350, 2100, (v) => Math.round(v).toLocaleString())}
          {cell(r.inc, 2, 11, (v) => "+" + fmtPct(v))}
        </tr>))}</tbody>
    </table></div>
  );
}

A. Example,Associate,Non-Litigation,4,M&A / PE,775,2050,86.5,,,
P. Example,Paralegal,Litigation,,Product Liability,365,1650,94.0,,,`;

function parseCsvRows(results) {
  const errors = []; const tks = []; let id = 1;
  const T = (s) => (s || "").toString().trim();
  results.data.forEach((row, i) => {
    const line = i + 2, name = T(row.name), title = T(row.title);
    if (!name && !title) return;
    if (!["Partner","Counsel","Associate","Paralegal"].includes(title)) { errors.push(`Row ${line}: unknown title "${title}"`); return; }
    let segment = /^lit/i.test(T(row.segment)) ? "Litigation" : "Non-Litigation";
    let cls = null;
    if (title === "Associate") { cls = parseInt(row.class, 10);
      if (!(cls >= 1 && cls <= 8)) { errors.push(`Row ${line}: associate class must be 1–8`); return; } }
    const rate2026 = parseFloat(row.rate_2026), hours = parseFloat(row.hours_t12m);
    let real = parseFloat(row.realization_pct);
    if (!(rate2026 > 0)) { errors.push(`Row ${line}: rate_2026 missing/invalid`); return; }
    if (!(hours > 0)) { errors.push(`Row ${line}: hours_t12m missing/invalid`); return; }
    if (!(real > 0)) { errors.push(`Row ${line}: realization_pct missing/invalid`); return; }
    if (real > 1.5) real = real / 100;
    const t = { id: id++, name, title, segment, cls, practice: T(row.practice) || "—",
      rate2026: round5(rate2026), hours: Math.round(hours), real: clamp(real, 0.5, 1.05), rates: {} };
    const hist = { 2026: round5(rate2026) };
    [["rate_2025",2025],["rate_2024",2024],["rate_2023",2023]].forEach(([k, yr]) => { const v = parseFloat(row[k]); if (v > 0) hist[yr] = round5(v); });
    let last = hist[2026];
    for (let yr = 2025; yr >= 2022; yr--) { if (!hist[yr]) hist[yr] = round5(last / 1.06); last = hist[yr]; }
    t.rates = hist; finishTk(t); tks.push(t);
  });
  return { tks, errors };
}

function DataTab({ tks, setTks, dataSource, setDataSource, exportSchedule, auditLog, exportAudit, logEvent }) {
  const [report, setReport] = useState(null);
  const fileRef = useRef(null);
  const onFile = (file) => {
    if (!file) return;
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: (res) => {
      const { tks: parsed, errors } = parseCsvRows(res);
      if (parsed.length) { setTks(parsed); setDataSource(file.name); logEvent("Loaded " + parsed.length + " timekeepers from " + file.name + (errors.length ? " (" + errors.length + " rows skipped)" : "")); }
      setReport({ loaded: parsed.length, skipped: errors.length, errors: errors.slice(0, 12), file: file.name });
    }, error: (e) => setReport({ loaded: 0, skipped: 0, errors: ["Parse failure: " + e.message], file: file.name }) });
  };
  const downloadTemplate = () => {
    const url = URL.createObjectURL(new Blob([CSV_TEMPLATE], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = "timekeeper_template.csv"; a.click(); URL.revokeObjectURL(url);
  };
  return (
    <div className="grid g2" style={{ alignItems: "start" }}>
      <Card title="Mass timekeeper load" sub="CSV · headers per template · nothing leaves the browser">
        <div className="drop" onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); onFile(e.dataTransfer.files[0]); }}
          onClick={() => fileRef.current && fileRef.current.click()}>
          <div className="droptitle">Drop timekeeper CSV here</div>
          <div className="snote">or click to browse · current source: <b>{dataSource}</b> · {tks.length} timekeepers</div>
          <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }} onChange={(e) => onFile(e.target.files[0])} />
        </div>
        <div className="scen-btns" style={{ marginTop: 12 }}>
          <button className="btn" onClick={downloadTemplate}>Download CSV template</button>
          <button className="btn" onClick={exportSchedule}>Export current schedule</button>
          <button className="btn gold" onClick={() => { setTks(MOCK_TKS); setDataSource("Mock data"); setReport(null); }}>Reset to mock</button>
        </div>
        {report && (
          <div className="report">
            <div className="dl"><span>File</span><b>{report.file}</b></div>
            <div className="dl"><span>Rows loaded</span><b className="pos-t">{report.loaded}</b></div>
            <div className="dl"><span>Rows skipped</span><b className={report.skipped ? "neg-t" : "pos-t"}>{report.skipped}</b></div>
            {report.errors.map((e, i) => <div key={i} className="errline">{e}</div>)}
          </div>)}
      </Card>
      <div className="stack">
      <Card title="Audit log" sub="material actions this session · exportable for the committee record"
        right={<button className="btn" onClick={exportAudit}>Export log</button>}>
        <div className="twrap" style={{ maxHeight: 260 }}><table className="mini">
          <thead><tr><th>Time</th><th style={{textAlign:"left"}}>Action</th></tr></thead>
          <tbody>{auditLog.length === 0 ? <tr><td colSpan={2} className="dim" style={{textAlign:"left"}}>No actions logged yet — preset changes, goal seeks, overrides, panel edits, data loads and approvals appear here.</td></tr>
            : [...auditLog].reverse().map((e, i) => (
            <tr key={i} style={{cursor:"default"}}><td className="dim" style={{whiteSpace:"nowrap"}}>{e.t}</td><td style={{textAlign:"left"}}>{e.msg}</td></tr>))}</tbody>
        </table></div>
      </Card>
      <Card title="Load specification" sub="hand this to finance / IT">
        <div className="notes">
          <p><b>Required:</b> name · title (Partner / Counsel / Associate / Paralegal) · segment (Litigation / Non-Litigation) · class (1–8, associates only) · practice · rate_2026 · hours_t12m · realization_pct (accepts 91.2 or 0.912).</p>
          <p><b>Optional:</b> rate_2025 / rate_2024 / rate_2023 for true YoY lines; missing years back-fill at an assumed 6% walk-back.</p>
          <p><b>Behavior:</b> rates round to nearest $5 on load; failing rows are skipped and itemized by line number — nothing silently mangles. All processing is in-browser; safe for confidential extracts on a firm machine.</p>
        </div>
      </Card>
      </div>
    </div>
  );
}

/* ---------- MEMO ---------- */
function memoText(M, cfg, scenario, MC, approvedCount) {
  const top = [...M.bySegment].sort((a, b) => b.uplift - a.uplift)[0];
  const panel = M.peer.firms.map((f) => f.name + " [" + f.src + "]").join(", ");
  return `MEMORANDUM

TO:       Executive Committee
FROM:     Office of the CFO — Pricing & Rates
DATE:     ${new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}
RE:       Recommended 2027 Standard Rate Structure (${scenario} scenario)

EXECUTIVE SUMMARY

We recommend a 2027 standard rate schedule producing a blended rack-rate increase of ${fmtPct(M.blendedInc)} and an effective increase of ${fmtPct(M.effBlendedInc)} after client rate caps (${fmtPct(cfg.capShare,0)} of the book capped at an average ${fmtPct(cfg.capLevel,1)}). The hours-weighted blended rate moves from ${fmt$(M.blended26)} to ${fmt$(M.blended27)}. Full-year effective uplift is ${fmtM(M.grossEff)} (${fmtM(M.capLeak)} of rack value is ceded to existing caps); applying a ${fmtPct(cfg.velocity,0)} year-1 repricing velocity and a realization drag of ${cfg.dragBps} bps per point above the assumed peer move, the recommendation delivers ${fmtM(M.net)} of year-1 net uplift. Following the increase, ${M.abovePeer} of ${M.headcount} timekeepers sit above the projected 2027 panel median (peers assumed to move ${fmtPct(cfg.peerInfl, 1)}).${cfg.goalTarget > 0 ? " The schedule was solved to a target blended move of " + fmtPct(cfg.goalTarget, 1) + " (scored increases scaled ×" + M.goalMult.toFixed(2) + ")." : ""}

PEER PANEL & SOURCES

Benchmarks draw on the PwC BRASS Survey (confidential composite) and Valeo Partners (publicly filed rate data), assembled into a ${M.peer.firms.length}-firm panel: ${panel}. Panel quartiles are computed live from the selected firms, and litigation and non-litigation partners are benchmarked separately to control for the filed-rate skew in Valeo data. Sensitivity testing across alternative panels (all firms, BRASS-only, Valeo-only, excluding the two highest-rate firms) is summarized in the console and does not change the direction of this recommendation.

METHODOLOGY

Partners (litigation and non-litigation), counsel, and paralegals are individually scored on a composite of trailing-twelve-month billable hours (${(cfg.wHours * 100).toFixed(0)}%), realization (${(cfg.wReal * 100).toFixed(0)}%), and headroom to the projected 2027 panel median (${(cfg.wPeer * 100).toFixed(0)}%). Scores map to increases between ${fmtPct(cfg.floorPct, 1)} and ${fmtPct(cfg.capPct, 1)}; scores below ${cfg.holdBelow} are held at a token ${fmtPct(cfg.floorPct * 0.5, 2)}. Segment adjusters this cycle: Litigation partners ${cfg.adj.PtrLit >= 0 ? "+" : ""}${cfg.adj.PtrLit.toFixed(1)} pp, Non-Litigation partners ${cfg.adj.PtrNonLit >= 0 ? "+" : ""}${cfg.adj.PtrNonLit.toFixed(1)} pp. Associates move on the class-year scale at a uniform ${fmtPct(cfg.assocScale, 1)}, preserving internal equity and recruiting parity. Rates round to the nearest $5.

KEY OBSERVATIONS

1. The largest dollar uplift sits in ${top.label} (${fmtM(top.uplift)}), where realization supports the move.
2. ${M.holds.length} timekeeper(s) are held below threshold${M.holds.length ? " (" + M.holds.slice(0, 4).map((h) => h.name).join(", ") + (M.holds.length > 4 ? ", et al." : "") + ")" : ""}; we recommend utilization plans rather than masking these inside a uniform increase.
3. ${M.ovr.length} manual override(s) are reflected in all totals${M.ovr.length ? " (" + M.ovr.map((o) => o.name).join(", ") + ")" : ""}.
4. The economics deliberately net out realization risk: every point of effective increase above the peer move is assumed to erode realization by ${cfg.dragBps} bps, and the recommendation remains accretive under that assumption.
5. Risk analysis: across ${MC ? MC.N.toLocaleString() : "2,500"} simulated market scenarios (peer move, drag, repricing velocity, hours and realization variance), the schedule produces positive year-1 net uplift in ${MC ? (MC.probPos*100).toFixed(1) : "—"}% of cases, with 90% confidence of at least ${MC ? fmtM(MC.p10) : "—"} and a median of ${MC ? fmtM(MC.p50) : "—"}.
6. Governance: ${M.flagged.length} timekeeper(s) carry QC flags for committee attention; ${approvedCount} of ${M.headcount} recommendations are marked approved in the console at the time of this memo. The full assumption register appears as Appendix 1.

RECOMMENDATION

Approve the 2027 standard rate schedule as modeled, effective January 1, 2027, with client-level exceptions managed through the rate-agreement workflow. Pricing will monitor Q1 realization against the new schedule and report variances exceeding 200 bps to this committee.`;
}

function MemoTab({ M, cfg, scenario, MC, statuses }) {
  const [copied, setCopied] = useState(false);
  const approvedCount = M.rows.filter((r) => statuses[r.id] === "approved").length;
  const text = useMemo(() => memoText(M, cfg, scenario, MC, approvedCount), [M, cfg, scenario, MC, approvedCount]);
  const copy = async () => { try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  const paras = text.split("\n\n");
  const memoAx = { ticks: { color: "#5A5443" }, grid: { color: "#E4DFCE" } };
  const exA = useMemo(() => ({ labels: M.ladder.map((l) => l.cls),
    datasets: [
      { label: "Panel P25", data: M.ladder.map((l) => Math.round(l.p25)), borderColor: "transparent", pointRadius: 0, fill: false },
      { label: "Panel P25–P75", data: M.ladder.map((l) => Math.round(l.p75)), borderColor: "transparent", pointRadius: 0, fill: "-1", backgroundColor: "rgba(20,86,63,.16)" },
      { label: "Panel median '26", data: M.ladder.map((l) => Math.round(l.p50)), borderColor: "#A87F2E", borderDash: [5,3], pointRadius: 0, borderWidth: 1.5, fill: false },
      { label: "Recommended '27", data: M.ladder.map((l) => l.firm27 && Math.round(l.firm27)), borderColor: "#14563F", borderWidth: 2.2, pointRadius: 3, fill: false }] }), [M]);
  const exB = useMemo(() => {
    const steps = [{ label: "2026 rev", y: [0, M.baseRev] }]; let run = M.baseRev;
    M.bySegment.forEach((s) => { steps.push({ label: s.label.replace("Partners — ", "Ptr "), y: [run, run + s.uplift] }); run += s.uplift; });
    if (M.drag > 0) steps.push({ label: "Real. drag", y: [run - M.drag, run] });
    steps.push({ label: "2027 net", y: [0, M.baseRev + M.net] });
    return { labels: steps.map((s) => s.label),
      datasets: [{ data: steps.map((s) => s.y.map((v) => +(v / 1e6).toFixed(2))),
        backgroundColor: steps.map((s, i) => i === 0 ? "#B9B29C" : i === steps.length - 1 ? "#14563F" : s.label === "Real. drag" ? "#C23934" : "#2E8B72"),
        borderRadius: 2, borderSkipped: false }] };
  }, [M]);
  return (
    <div>
      <div className="noprint memo-actions">
        <button className="btn" onClick={copy}>{copied ? "✓ Copied" : "Copy memo text"}</button>
        <button className="btn gold" onClick={() => window.print()}>Print / PDF</button>
      </div>
      <div className="memo">
        <div className="mh">
          <div><span className="k">TO:</span><span>Executive Committee</span></div>
          <div><span className="k">FROM:</span><span>Office of the CFO — Pricing & Rates</span></div>
          <div><span className="k">DATE:</span><span>{new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</span></div>
          <div><span className="k">RE:</span><span><b>Recommended 2027 Standard Rate Structure — {scenario} scenario</b></span></div>
        </div>
        {paras.slice(1).map((p, i) => {
          const isHead = /^[A-Z\s&]+$/.test(p.trim()) && p.trim().length < 44;
          return isHead ? <h2 key={i}>{p.trim()}</h2> : <p key={i}>{p}</p>;
        })}
        <h2>Exhibit A — Associate Scale vs Peer Panel</h2>
        <div className="chartbox">
          <ChartBox type="line" data={exA} options={{ ...legend(), scales: { y: { ...money, ...memoAx }, x: memoAx } }} height={230} />
          <div className="cap-t">Recommended 2027 scale against panel P25–P75 ({M.peer.firms.length}-firm panel, BRASS + Valeo).</div>
        </div>
        <h2>Exhibit B — Revenue Bridge ($M)</h2>
        <div className="chartbox">
          <ChartBox type="bar" data={exB} options={{ plugins: { legend: { display: false },
            tooltip: { callbacks: { label: (c) => "$" + (c.raw[1] - c.raw[0]).toFixed(2) + "M" } } },
            scales: { y: { ticks: { callback: (v) => "$" + v + "M" }, ...memoAx }, x: memoAx } }} height={210} />
          <div className="cap-t">2026 revenue to 2027 net: segment uplift at realization, less modeled realization drag.</div>
        </div>
        <h2>Exhibit C — Segment Schedule (standard vs effective)</h2>
        <table><thead><tr><th>Segment</th><th>N</th><th>Avg '26</th><th>Avg '27</th><th>Inc std/eff</th><th>Eff uplift</th></tr></thead>
          <tbody>{M.bySegment.map((s) => (
            <tr key={s.key}><td>{s.label}</td><td>{s.n}</td><td>{fmt$(s.avg26)}</td><td><b>{fmt$(s.avg27)}</b></td><td>+{fmtPct(s.inc)} / +{fmtPct(s.incEff)}</td><td>{fmtM(s.uplift)}</td></tr>))}</tbody></table>
        <h2>Appendix 1 — Assumption Register</h2>
        <table><thead><tr><th>Assumption</th><th>Value</th><th>Source</th></tr></thead>
          <tbody>{assumptions(M, cfg).map((a) => (
            <tr key={a.k}><td>{a.k}</td><td><b>{a.v}</b></td><td>{a.src}</td></tr>))}</tbody></table>
      </div>
    </div>
  );
}


/* ---------- shell v4 ---------- */
const PRESETS = {
  Conservative: { floorPct: 1.5, capPct: 8, holdBelow: 35, assocScale: 6, peerInfl: 6, dragBps: 25, capShare: 45, capLevel: 3.5, velocity: 60, adj: { PtrLit: 0, PtrNonLit: 0, Counsel: 0, Paralegal: 0 } },
  Base: { floorPct: 2, capPct: 12, holdBelow: 30, assocScale: 8, peerInfl: 7, dragBps: 15, capShare: 35, capLevel: 4, velocity: 70, adj: { PtrLit: 0, PtrNonLit: 0, Counsel: 0, Paralegal: 0 } },
  Aggressive: { floorPct: 3, capPct: 14, holdBelow: 25, assocScale: 10, peerInfl: 8, dragBps: 10, capShare: 30, capLevel: 4.5, velocity: 78, adj: { PtrLit: 0.5, PtrNonLit: 0.5, Counsel: 0, Paralegal: 0 } },
};
const TABS = ["Overview", "Rate Model", "Peer Panel", "Risk & QC", "Trends", "Data", "Memo"];
const now = () => new Date().toLocaleTimeString("en-US", { hour12: false });

function App() {
  const [tab, setTab] = useState("Overview");
  const [tks, setTks] = useState(MOCK_TKS);
  const [dataSource, setDataSource] = useState("Mock data");
  const [scenario, setScenario] = useState("Base");
  const [cfg, setCfgRaw] = useState({ wHours: .4, wReal: .4, wPeer: .2, goalTarget: 0, roundTo: 5, ...PRESETS.Base });
  const [overrides, setOverridesRaw] = useState({});
  const [selectedPeers, setSelectedPeersRaw] = useState(new Set(PEER_FIRMS.slice(0, 8).map((f) => f.id)));
  const [showReco, setShowReco] = useState(true);
  const [scenarios, setScenarios] = useState({});
  const [statuses, setStatuses] = useState({});
  const [auditLog, setAuditLog] = useState([]);

  const logEvent = (msg) => setAuditLog((l) => [...l.slice(-199), { t: now(), msg }]);

  const setCfg = (c) => {
    if (c.goalTarget !== cfg.goalTarget) logEvent(c.goalTarget > 0 ? "Goal seek set to " + c.goalTarget + "%" : "Goal seek cleared");
    if (c.roundTo !== cfg.roundTo) logEvent("Rounding policy set to nearest $" + c.roundTo);
    setCfgRaw(c); setScenario("Custom");
  };
  const applyPreset = (name) => { setCfgRaw((c) => ({ ...c, ...PRESETS[name], goalTarget: 0 })); setScenario(name); logEvent("Applied " + name + " preset"); };
  const setOverrides = (fn) => setOverridesRaw((o) => { const n = typeof fn === "function" ? fn(o) : fn; return n; });
  const setSelectedPeers = (fn) => setSelectedPeersRaw((s) => {
    const n = typeof fn === "function" ? fn(s) : fn;
    const added = [...n].filter((x) => !s.has(x)), removed = [...s].filter((x) => !n.has(x));
    [...added, ...removed].forEach((id) => { const f = PEER_FIRMS.find((p) => p.id === id);
      if (f) logEvent((added.includes(id) ? "Added " : "Removed ") + f.name + " " + (added.includes(id) ? "to" : "from") + " peer panel"); });
    return n;
  });
  const setStatus = (id, st, name) => { setStatuses((s) => ({ ...s, [id]: st })); logEvent((st === "approved" ? "Approved " : "Flagged for review: ") + name); };

  const M = useMemo(() => computeModel(tks, cfg, overrides, selectedPeers), [tks, cfg, overrides, selectedPeers]);
  const MC = useMemo(() => runMonteCarlo(M, cfg), [M, cfg]);

  const bulkApprove = () => {
    const targets = M.rows.filter((r) => !r.flags.length && statuses[r.id] !== "approved");
    setStatuses((s) => { const n = { ...s }; targets.forEach((r) => { n[r.id] = "approved"; }); return n; });
    logEvent("Bulk-approved " + targets.length + " unflagged timekeepers");
  };
  const saveScenario = (slot) => { setScenarios((s) => ({ ...s,
    [slot]: { name: scenario, inc: M.blendedInc, gross: M.grossEff, net: M.net, holds: M.holds.length } }));
    logEvent("Saved current levers as Scenario " + slot); };

  const exportSchedule = () => {
    const head = "name,title,segment,class,practice,rate_2026,score,basis,increase_pct,rate_2027,effective_increase_pct,vs_panel_median_2027e_pct,flags,status\n";
    const body = M.rows.map((r) => [r.name, r.title, r.segment, r.cls || "", '"' + r.practice + '"',
      r.rate2026, r.score, r.mode, r.incPct.toFixed(2), r.rate2027, r.incEff.toFixed(2), r.vsPeer27.toFixed(2),
      '"' + r.flags.join("; ") + '"', statuses[r.id] || "proposed"].join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([head + body], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = "rate_schedule_2027.csv"; a.click(); URL.revokeObjectURL(url);
    logEvent("Exported rate schedule CSV (" + M.rows.length + " rows)");
  };
  const exportAudit = () => {
    const body = "time,action\n" + auditLog.map((e) => e.t + ',"' + e.msg.replace(/"/g, '""') + '"').join("\n");
    const url = URL.createObjectURL(new Blob([body], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = "rate_committee_audit_log.csv"; a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div className="page">
      <header className="mast noprint">
        <div className="mast-inner">
          <div>
            <div className="firmname">Meridian &amp; Cole <span>LLP</span></div>
            <div className="apptitle">2027 Rate Committee Console <span className="badge">{dataSource}</span> <span className="badge gold-b">BRASS + Valeo panel</span> <span className="badge">MC risk: on</span></div>
          </div>
          <div className="presets" role="group" aria-label="Scenario">
            {Object.keys(PRESETS).map((p) => (
              <button key={p} className={"preset" + (scenario === p ? " on" : "")} onClick={() => applyPreset(p)}>{p}</button>))}
            {scenario === "Custom" && <span className="preset on custom">Custom</span>}
          </div>
        </div>
        <nav className="tabs" role="tablist">
          {TABS.map((t) => (
            <button key={t} role="tab" aria-selected={tab === t} className={"tabbtn" + (tab === t ? " on" : "")} onClick={() => setTab(t)}>
              {t}{t === "Risk & QC" && M.flagged.length > 0 && <span className="tabcount">{M.flagged.length}</span>}</button>))}
        </nav>
      </header>
      <main className="content">
        {tab === "Overview" && <OverviewTab M={M} MC={MC} cfg={cfg} setCfg={setCfg} scenario={scenario} exportSchedule={exportSchedule} goMemo={() => setTab("Memo")} />}
        {tab === "Rate Model" && <RatesTab M={M} cfg={cfg} setCfg={setCfg} overrides={overrides} setOverrides={setOverrides} scenarios={scenarios} saveScenario={saveScenario} scenario={scenario} statuses={statuses} setStatus={setStatus} />}
        {tab === "Peer Panel" && <PeerTab M={M} cfg={cfg} overrides={overrides} tks={tks} selectedPeers={selectedPeers} setSelectedPeers={setSelectedPeers} showReco={showReco} setShowReco={setShowReco} />}
        {tab === "Risk & QC" && <RiskTab M={M} MC={MC} cfg={cfg} statuses={statuses} setStatus={setStatus} bulkApprove={bulkApprove} />}
        {tab === "Trends" && <TrendsTab M={M} />}
        {tab === "Data" && <DataTab tks={tks} setTks={setTks} dataSource={dataSource} setDataSource={setDataSource} exportSchedule={exportSchedule} auditLog={auditLog} exportAudit={exportAudit} logEvent={logEvent} />}
        {tab === "Memo" && <MemoTab M={M} cfg={cfg} scenario={scenario} MC={MC} statuses={statuses} />}
      </main>
      <footer className="foot noprint">Peer values are placeholders pending BRASS / Valeo extracts · All computation is in-browser; no data leaves this file · Monte Carlo is seeded for reproducibility.</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
